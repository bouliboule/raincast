<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Raincast</title>
  <meta name="theme-color" content="#ffe14d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Raincast">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script>
    // Apply the saved theme before first paint to avoid a flash.
    try { const t = localStorage.getItem('raincast.theme'); if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <main>
    <header>
      <button id="place" class="place box press" aria-label="Changer de lieu" data-i18n-aria="changePlace">
        <span id="place-name" data-i18n="choosePlace">Choisir un lieu</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <button id="theme" class="icon-btn theme-btn box press" aria-label="Thème"></button>
      <button id="refresh" class="icon-btn box press" aria-label="Actualiser" data-i18n-aria="refresh">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </header>

    <section class="card box" id="card">
      <h1 id="headline">Chargement…</h1>
      <div class="times"><span id="t-start">--:--</span><span id="t-end">--:--</span></div>
      <div class="slots" id="slots"></div>
      <div class="ticks" id="ticks"></div>
      <div class="summary" id="summary"></div>
      <ol class="legend" id="legend">
        <li><i class="lv1"></i><span data-i18n="legendDry">Sec</span></li>
        <li><i class="lv2"></i><span data-i18n="legendLight">Faible</span></li>
        <li><i class="lv3"></i><span data-i18n="legendModerate">Modérée</span></li>
        <li><i class="lv4"></i><span data-i18n="legendHeavy">Forte</span></li>
      </ol>
    </section>

    <section class="outlook" id="outlook" hidden>
      <h2 data-i18n="outlook">Prévisions</h2>
      <div class="periods" id="periods"></div>
    </section>

    <p class="meta" id="meta"></p>

    <footer class="credit">
      <span data-i18n="dataCredit">Données&nbsp;:</span> <a href="https://meteofrance.com" target="_blank" rel="noopener">Météo-France</a><br>
      <span data-i18n="forecastCredit">Prévisions&nbsp;:</span> <a href="https://open-meteo.com" target="_blank" rel="noopener">Open-Meteo</a> (CC BY 4.0)<br>
      <span data-i18n="notAffiliated">Projet personnel, non affilié à Météo-France</span>
      <div class="lang-switch" role="group" aria-label="Langue / Language">
        <button type="button" data-lang="fr" lang="fr">Français</button>
        <button type="button" data-lang="en" lang="en">English</button>
      </div>
    </footer>
  </main>

  <dialog id="picker">
    <form method="dialog" class="picker">
      <div class="picker-head">
        <input id="q" type="search" placeholder="Rechercher une ville…" data-i18n-placeholder="searchPlaceholder" autocomplete="off" enterkeyhint="search">
        <button value="cancel" class="icon-btn box press" aria-label="Fermer" data-i18n-aria="close">✕</button>
      </div>
      <button type="button" id="locate" class="locate box press" data-i18n="myLocation">📍 Ma position</button>
      <ul id="results"></ul>
    </form>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
